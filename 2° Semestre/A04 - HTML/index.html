<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JFK Pacotes Turísticos</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="footer.css">
</head>
<body>
    <header>
        <div class="logo">
            <img src="logo.png" alt="Logo JFK">
        </div>
        <nav>
            <ul>
                <li><a href="#">Início</a></li>
                <li><a href="#">Pacotes</a></li>
                <li><a href="#">Sobre nós</a></li>
                <li><a href="#">Contato</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section class="banner-rotativo">
            <img src="banner1.jpg" alt="Banner 1">
            <img src="banner2.jpg" alt="Banner 2">
            <img src="banner3.jpg" alt="Banner 3">
        </section>

        <section class="pacotes">
            <h2>Nossos Pacotes</h2>
            <div class="pacote">
                <img src="pacote1.jpg" alt="Pacote 1">
                <h3>Pacote 1</h3>
                <p>Descrição do pacote 1</p>
                <a href="#">Saiba mais</a>
            </div>
            <div class="pacote">
                <img src="pacote2.jpg" alt="Pacote 2">
                <h3>Pacote 2</h3>
                <p>Descrição do pacote 2</p>
                <a href="#">Saiba mais</a>
            </div>
            <div class="pacote">
                <img src="pacote3.jpg" alt="Pacote 3">
                <h3>Pacote 3</h3>
                <p>Descrição do pacote 3</p>
                <a href="#">Saiba mais</a>
            </div>
        </section>
    </main>

    <footer>
        <div class="redes-sociais">
            <a href="#"><img src="facebook.png" alt="Facebook"></a>
            <a href="#"><img src="instagram.png" alt="Instagram"></a>
            <a href="#"><img src="twitter.png" alt="Twitter"></a>
        </div>
        <p>&copy; JFK Pacotes Turísticos</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
